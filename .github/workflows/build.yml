name: Test and build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Legenda app.py
      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/Legenda/Legenda --smoke-test
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Legenda/Legenda.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
      - name: Smoke test macOS executable
        if: runner.os == 'macOS'
        run: dist/Legenda.app/Contents/MacOS/Legenda --smoke-test
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Legenda -DestinationPath Legenda-${{ matrix.target }}.zip
      - name: Archive Linux
        if: runner.os == 'Linux'
        run: tar -czf Legenda-${{ matrix.target }}.tar.gz -C dist Legenda
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: tar -czf Legenda-${{ matrix.target }}.tar.gz -C dist Legenda.app
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: bash scripts/build-appimage.sh
      - name: Smoke test AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a ./Legenda-linux-x64.AppImage --appimage-extract-and-run --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: Legenda-${{ matrix.target }}
          path: Legenda-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30

  linux-distros:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'fedora:43']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Legenda-linux-x64
          path: artifacts
      - name: Test AppImage in distribution
        env:
          DISTRO: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" "$DISTRO" sh -ec '
            if command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y xvfb xauth libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 ca-certificates
            else
              dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth libX11 libXext libXrender libXft fontconfig ca-certificates tar
            fi
            cp /artifacts/Legenda-linux-x64.AppImage /tmp/Legenda.AppImage
            chmod +x /tmp/Legenda.AppImage
            cd /tmp
            ./Legenda.AppImage --appimage-extract >/dev/null
            Xvfb :99 -screen 0 1280x900x24 &
            export DISPLAY=:99
            sleep 2
            timeout 60 ./squashfs-root/AppRun --smoke-test
          '

  release:
    name: Publish release
    needs: [build, linux-distros]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Legenda-*
          merge-multiple: true
          path: release-assets
      - name: Validate packages and generate checksums
        working-directory: release-assets
        run: |
          test -s Legenda-linux-x64.AppImage
          test -s Legenda-linux-x64.tar.gz
          test -s Legenda-windows-x64.zip
          test -s Legenda-macos-arm64.tar.gz
          sha256sum Legenda-* > SHA256SUMS.txt
      - name: Publish all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if ! jq -e '.isDraft == true' release-state.json >/dev/null; then
              echo 'Release already published; refusing to replace its files.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Legenda $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
