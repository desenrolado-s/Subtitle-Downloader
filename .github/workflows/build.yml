name: Test and build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Set up MSYS2 for Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Linux GTK dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-keyring xvfb xauth dbus-x11
      - name: macOS GTK dependencies
        if: runner.os == 'macOS'
        run: |
          brew install python@3.14 gtk4 pygobject3
          brew list pygobject3 --versions
          brew info pygobject3
      - name: Install build tools
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-build.txt
      - name: Windows GTK dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          pacman -S --needed --noconfirm \
            mingw-w64-ucrt-x86_64-python \
            mingw-w64-ucrt-x86_64-python-pip \
            mingw-w64-ucrt-x86_64-python-gobject \
            mingw-w64-ucrt-x86_64-gtk4
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Tests
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -v
          else
            BREW_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
            "$BREW_PYTHON" -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
            "$BREW_PYTHON" -m unittest discover -v
          fi
      - name: Windows tests
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python -m unittest discover -v
      - name: Build application
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-build.txt
          .venv/bin/python -m PyInstaller --noconfirm --clean --onedir --windowed --name Legenda --hidden-import=keyring.backends.SecretService --hidden-import=gi.repository.Gtk --hidden-import=gi.repository.Gdk --hidden-import=gi.repository.Gio --hidden-import=gi.repository.GLib app.py
          bash scripts/bundle-ca-certificates.sh dist/Legenda/_internal
          # GI uses the host GTK/GLib stack.  Do not let PyInstaller's copies
          # of the platform base libraries override that stack on other distros.
          find dist/Legenda \( -name "libglib-2.0.so*" -o -name "libgobject-2.0.so*" -o -name "libgio-2.0.so*" -o -name "libgmodule-2.0.so*" -o -name "libgirepository-*.so*" -o -name "libmount.so*" -o -name "libblkid.so*" -o -name "libuuid.so*" -o -name "libsystemd.so*" -o -name "libudev.so*" \) -delete
          rm -rf dist/Legenda/_internal/gio_modules dist/Legenda/gio_modules
          # Bundle the GTK typelibs instead of relying on the host packages.
          bash scripts/bundle-gtk-typelibs.sh dist/Legenda/_internal/gi_typelibs
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          BREW_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          test -x "$BREW_PYTHON"
          "$BREW_PYTHON" -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; print(Gtk.get_major_version(), Gtk.get_minor_version())'
          "$BREW_PYTHON" -m venv --system-site-packages .venv-macos
          .venv-macos/bin/python -m pip install --break-system-packages -r requirements-build.txt
          .venv-macos/bin/python -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; print("Bundler GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
          GTK_DYLIB="$(brew --prefix gtk4)/lib/libgtk-4.1.dylib"
          test -f "$GTK_DYLIB"
          .venv-macos/bin/python -m PyInstaller --noconfirm --clean --onedir --windowed --name Legenda --add-binary "$GTK_DYLIB:." --hidden-import=gi.repository.Gtk --hidden-import=gi.repository.Gdk --hidden-import=gi.repository.Gio --hidden-import=gi.repository.GLib app.py
      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Legenda \
            --collect-all gi \
            --add-data "/ucrt64/share/glib-2.0/schemas:share/glib-2.0/schemas" \
            --hidden-import=gi.repository.Gtk \
            --hidden-import=gi.repository.Gdk \
            --hidden-import=gi.repository.Gio \
            --hidden-import=gi.repository.GLib app.py
      - name: Smoke test GTK executable
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: dbus-run-session -- xvfb-run -a dist/Legenda/Legenda --smoke-test
      - name: Smoke test macOS executable
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: env -i HOME="$HOME" TMPDIR="$RUNNER_TEMP" PATH=/usr/bin:/bin:/usr/sbin:/sbin dist/Legenda/Legenda --smoke-test
      - name: Archive Linux
        if: runner.os == 'Linux'
        run: tar -czf Legenda-${{ matrix.target }}.tar.gz -C dist Legenda
      - name: Archive macOS
        if: runner.os == 'macOS'
        run: tar -czf Legenda-${{ matrix.target }}.tar.gz -C dist Legenda.app
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Legenda/* -DestinationPath Legenda-${{ matrix.target }}.zip
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: bash scripts/build-appimage.sh
      - name: Smoke test AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: dbus-run-session -- xvfb-run -a ./Legenda-linux-x64.AppImage --appimage-extract-and-run --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: Legenda-${{ matrix.target }}
          path: Legenda-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 30

  linux-distros:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'fedora:43', 'archlinux:latest', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Legenda-linux-x64
          path: artifacts
      - name: Test Linux packages in distribution
        env:
          DISTRO: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" "$DISTRO" sh -ec '
            if command -v apt-get >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y xvfb xauth libgtk-4-1 libgirepository-1.0-1 ca-certificates dbus-x11
            elif command -v dnf >/dev/null; then
              dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth gtk4 gobject-introspection ca-certificates tar dbus-daemon
            elif command -v zypper >/dev/null; then
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends xorg-x11-server-Xvfb xauth libgtk-4-1 gobject-introspection ca-certificates tar dbus-1 dbus-1-daemon google-noto-sans-fonts
              # The GTK typelibs must come from the AppImage, not from the host.
              # openSUSE ships them in a package separate from libgtk-4-1.
              test ! -e /usr/lib64/girepository-1.0/Gtk-4.0.typelib
              # The Tumbleweed GTK renderer needs a software GL backend under Xvfb.
              export LIBGL_ALWAYS_SOFTWARE=1
              export GALLIUM_DRIVER=llvmpipe
            else
              pacman -Sy --noconfirm xorg-server-xvfb xorg-xauth python-gobject gtk4 gobject-introspection ca-certificates tar dbus
            fi
            tar -xzf /artifacts/Legenda-linux-x64.tar.gz -C /tmp
            cp /artifacts/Legenda-linux-x64.AppImage /tmp/Legenda.AppImage
            chmod +x /tmp/Legenda.AppImage
            cd /tmp
            Xvfb :99 -screen 0 1280x900x24 &
            export DISPLAY=:99
            # Use the software renderer for the headless Xvfb smoke test.
            export GSK_RENDERER=cairo
            export GTK_A11Y=none
            sleep 2
            ./Legenda.AppImage --appimage-extract >/dev/null
            test -s squashfs-root/usr/Legenda/_internal/certs/ca-certificates.crt
            test -s squashfs-root/usr/Legenda/_internal/gi_typelibs/Gtk-4.0.typelib
            test -s squashfs-root/usr/Legenda/_internal/gi_typelibs/Graphene-1.0.typelib
            if command -v dbus-run-session >/dev/null; then
              dbus-run-session -- timeout 60 ./Legenda/Legenda --smoke-test
              dbus-run-session -- timeout 60 ./squashfs-root/AppRun --smoke-test
            elif command -v dbus-daemon >/dev/null; then
              # The Tumbleweed base image contains an empty machine-id file.
              rm -f /etc/machine-id /var/lib/dbus/machine-id
              dbus-uuidgen --ensure=/etc/machine-id
              ln -s /etc/machine-id /var/lib/dbus/machine-id
              export DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address=1 --print-pid=1 | sed -n '1p')"
              timeout 60 ./Legenda/Legenda --smoke-test
              timeout 60 ./squashfs-root/AppRun --smoke-test
            else
              timeout 60 ./Legenda/Legenda --smoke-test
              timeout 60 ./squashfs-root/AppRun --smoke-test
            fi
          '

  release:
    name: Publish release
    needs: [build, linux-distros]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Legenda-*
          merge-multiple: true
          path: release-assets
      - name: Include release version in asset names
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for file in Legenda-linux-x64.AppImage Legenda-linux-x64.tar.gz Legenda-macos-arm64.tar.gz Legenda-windows-x64.zip; do
            test -s "$file"
            case "$file" in
              *.tar.gz) mv "$file" "${file%.tar.gz}-${RELEASE_TAG}.tar.gz" ;;
              *) mv "$file" "${file%.*}-${RELEASE_TAG}.${file##*.}" ;;
            esac
          done
      - name: Validate packages and generate checksums
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "Legenda-linux-x64-${RELEASE_TAG}.AppImage"
          test -s "Legenda-linux-x64-${RELEASE_TAG}.tar.gz"
          test -s "Legenda-macos-arm64-${RELEASE_TAG}.tar.gz"
          test -s "Legenda-windows-x64-${RELEASE_TAG}.zip"
          sha256sum Legenda-* > SHA256SUMS.txt
      - name: Install zsync
        run: sudo apt-get update && sudo apt-get install -y zsync
      - name: Generate AppImage zsync update file
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          appimage="$(ls Legenda-linux-x64*.AppImage)"
          test -n "$appimage"
          url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/$(basename "$appimage")"
          zsyncmake -u "$url" -o Legenda-linux-x64.AppImage.zsync "$appimage"
          test -s Legenda-linux-x64.AppImage.zsync
      - name: Publish all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if ! jq -e '.isDraft == true' release-state.json >/dev/null; then
              echo 'Release already published; refusing to replace its files.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Legenda $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
