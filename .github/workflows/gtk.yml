name: GTK migration validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gtk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-venv python3-keyring xvfb xauth dbus-x11
      - name: Test GTK widgets and services
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -v
      - name: Open and close GTK application
        timeout-minutes: 2
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 app.py --smoke-test
      - name: Create build environment with native GTK bindings
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-build.txt
      - name: Package GTK application
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --onedir --windowed --name Legenda --hidden-import=keyring.backends.SecretService --hidden-import=gi.repository.Gtk --hidden-import=gi.repository.Gdk --hidden-import=gi.repository.Gio --hidden-import=gi.repository.GLib app.py
          find dist/Legenda -name "libglib-2.0.so*" -o -name "libgobject-2.0.so*" -o -name "libgio-2.0.so*" -o -name "libgmodule-2.0.so*" -o -name "libgirepository-*.so*" | xargs -r rm -f
          rm -rf dist/Legenda/_internal/gio_modules dist/Legenda/gio_modules
          bash scripts/bundle-gtk-typelibs.sh dist/Legenda/_internal/gi_typelibs
      - name: Test packaged GTK application
        timeout-minutes: 2
        run: dbus-run-session -- xvfb-run -a dist/Legenda/Legenda --smoke-test
      - name: Create and test GTK AppImage
        timeout-minutes: 5
        run: |
          APPIMAGE_VERSION=0.0.0 bash scripts/build-appimage.sh
          dbus-run-session -- xvfb-run -a ./Legenda-linux-x64.AppImage --appimage-extract-and-run --smoke-test
          mv Legenda-linux-x64.AppImage Legenda-GTK-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Legenda-GTK-linux-x64
          path: Legenda-GTK-linux-x64.AppImage
          if-no-files-found: error
